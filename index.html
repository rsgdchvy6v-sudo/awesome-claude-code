<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Frost Survival</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a1628; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; }
  #canvas { display: block; touch-action: none; }
  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    padding: env(safe-area-inset-top, 12px) 12px 8px;
    background: linear-gradient(to bottom, rgba(10,22,40,0.92), transparent);
    pointer-events: none; z-index: 10;
  }
  #title { color: #fff; font-size: 18px; font-weight: 800; text-shadow: 0 2px 8px rgba(0,150,255,0.8), 0 0 20px rgba(0,150,255,0.4); letter-spacing: 1px; margin-bottom: 6px; }
  #resources {
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .res-pill {
    display: flex; align-items: center; gap: 5px;
    background: rgba(255,255,255,0.12); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.2); border-radius: 20px;
    padding: 4px 10px; color: #fff; font-size: 13px; font-weight: 700;
  }
  .res-icon { font-size: 15px; }
  #bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 12px 16px calc(env(safe-area-inset-bottom, 12px) + 8px);
    background: linear-gradient(to top, rgba(10,22,40,0.95), transparent);
    z-index: 10;
    display: flex; gap: 10px; justify-content: center;
  }
  .btn {
    background: linear-gradient(135deg, #1a6abf, #0d3f73);
    border: 1.5px solid rgba(100,180,255,0.5);
    border-radius: 16px; color: #fff; font-size: 12px; font-weight: 700;
    padding: 10px 14px; cursor: pointer; text-align: center;
    min-width: 70px; transition: all 0.15s;
    box-shadow: 0 4px 12px rgba(0,100,200,0.3);
    -webkit-user-select: none; user-select: none;
  }
  .btn:active { transform: scale(0.93); background: linear-gradient(135deg, #2580df, #1050a0); }
  .btn.disabled { opacity: 0.4; }
  .btn-icon { font-size: 18px; display: block; margin-bottom: 2px; }
  #toast {
    position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%);
    background: rgba(30,60,120,0.9); backdrop-filter: blur(12px);
    border: 1px solid rgba(100,160,255,0.4); border-radius: 12px;
    color: #fff; font-size: 13px; font-weight: 600; padding: 8px 18px;
    pointer-events: none; z-index: 20; opacity: 0; transition: opacity 0.3s;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; }
  #day-counter {
    position: fixed; top: calc(env(safe-area-inset-top, 12px) + 6px); right: 14px;
    color: rgba(200,220,255,0.9); font-size: 12px; font-weight: 700;
    background: rgba(0,0,0,0.3); border-radius: 10px; padding: 4px 10px;
    pointer-events: none; z-index: 11;
  }
  #storm-warning {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(180, 40, 40, 0.95); backdrop-filter: blur(12px);
    border: 2px solid rgba(255,100,100,0.6); border-radius: 20px;
    color: #fff; font-size: 20px; font-weight: 900; padding: 20px 32px;
    text-align: center; z-index: 30; display: none;
    animation: shake 0.5s infinite alternate;
    text-shadow: 0 0 20px rgba(255,100,0,1);
  }
  @keyframes shake { from { transform: translate(-50%,-50%) rotate(-1deg); } to { transform: translate(-50%,-50%) rotate(1deg); } }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="hud">
  <div id="title">❄️ FROST SURVIVAL</div>
  <div id="resources">
    <div class="res-pill"><span class="res-icon">🪙</span><span id="r-gold">0</span></div>
    <div class="res-pill"><span class="res-icon">🥩</span><span id="r-food">0</span></div>
    <div class="res-pill"><span class="res-icon">🪵</span><span id="r-wood">0</span></div>
    <div class="res-pill"><span class="res-icon">👷</span><span id="r-workers">3</span></div>
  </div>
</div>
<div id="day-counter">Day <span id="day-num">1</span></div>
<div id="bottom-bar">
  <div class="btn" id="btn-worker" onclick="buyWorker()"><span class="btn-icon">👷</span>Worker<br><span id="worker-cost" style="color:#adf">🪙 20</span></div>
  <div class="btn" id="btn-wall" onclick="upgradeWall()"><span class="btn-icon">🧱</span>Wall<br><span id="wall-cost" style="color:#adf">🪵 30</span></div>
  <div class="btn" id="btn-fire" onclick="upgradeFire()"><span class="btn-icon">🔥</span>Hearth<br><span id="fire-cost" style="color:#adf">🪵 20</span></div>
  <div class="btn" id="btn-feast" onclick="feast()"><span class="btn-icon">🍖</span>Feast<br><span id="feast-cost" style="color:#adf">🥩 15</span></div>
</div>
<div id="toast"></div>
<div id="storm-warning">🌨️ BLIZZARD INCOMING! 🌨️<br><small style="font-size:14px;font-weight:500">Survive the storm!</small></div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// ─── Responsive canvas ──────────────────────────────────────────────────────────────────────────────
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ─── Constants ─────────────────────────────────────────────────────────────────────────────────────
const TW = 52, TH = 26; // isometric tile width/height
const GRID_COLS = 14, GRID_ROWS = 14;
const BASE_CX = 7, BASE_CY = 7; // base center in grid

// ─── Game state ──────────────────────────────────────────────────────────────────────────────────
const state = {
  gold: 10, food: 10, wood: 5,
  workers: [], workerCost: 20,
  wallLevel: 1, wallCost: 30,
  fireLevel: 1, fireCost: 20,
  feastCost: 15,
  day: 1, dayTimer: 0, DAY_DURATION: 60,
  storm: false, stormTimer: 0, stormIntensity: 0,
  snowParticles: [],
  resourceNodes: [],
  floatingTexts: [],
  cameraX: 0, cameraY: 0,
  tick: 0,
  survivalScore: 0,
};

// ─── Iso projection ──────────────────────────────────────────────────────────────────────────────
function isoProject(gx, gy) {
  const sx = canvas.width / 2 + state.cameraX;
  const sy = canvas.height * 0.38 + state.cameraY;
  return {
    x: sx + (gx - gy) * (TW / 2),
    y: sy + (gx + gy) * (TH / 2),
  };
}

// ─── Resource nodes ──────────────────────────────────────────────────────────────────────────────
function initResourceNodes() {
  state.resourceNodes = [];
  const types = [
    { type: 'tree', icon: '🌲', color: '#2d7a3a', yield: 'wood', amt: 3, max: 12, rate: 0.008 },
    { type: 'animal', icon: '🐻', color: '#7a5230', yield: 'food', amt: 4, max: 10, rate: 0.006 },
    { type: 'mine', icon: '⛏️', color: '#8a7a50', yield: 'gold', amt: 2, max: 8, rate: 0.005 },
  ];
  const positions = [];
  for (let i = 0; i < 22; i++) {
    let gx, gy, tries = 0;
    do {
      gx = Math.floor(Math.random() * GRID_COLS);
      gy = Math.floor(Math.random() * GRID_ROWS);
      tries++;
    } while (tries < 50 && (
      Math.abs(gx - BASE_CX) < 3 && Math.abs(gy - BASE_CY) < 3 ||
      positions.some(p => p.x === gx && p.y === gy)
    ));
    positions.push({ x: gx, y: gy });
    const t = types[i % types.length];
    state.resourceNodes.push({
      ...t,
      gx, gy,
      stock: t.max,
      id: i,
      depleted: false,
      regenTimer: 0,
    });
  }
}

// ─── Workers ─────────────────────────────────────────────────────────────────────────────────────────
function createWorker(id) {
  // Spread workers around base so they don't stack on each other
  const angle = (id / 8) * Math.PI * 2 + Math.random() * 0.5;
  const r = 0.5 + Math.random() * 0.3;
  const homeOffset = { x: Math.cos(angle) * r, y: Math.sin(angle) * r };
  const startGx = BASE_CX + homeOffset.x;
  const startGy = BASE_CY + homeOffset.y;
  const p = isoProject(startGx, startGy);
  return {
    id,
    x: p.x, y: p.y,
    gx: startGx, gy: startGy,
    homeOffset,
    targetNode: null,
    state: 'idle',
    carrying: null, carryAmt: 0,
    speed: 1.8 + Math.random() * 0.5,
    color: `hsl(${200 + id * 30},70%,70%)`,
    bobOffset: Math.random() * Math.PI * 2,
    gatherTimer: 0,
  };
}

function initWorkers() {
  for (let i = 0; i < 3; i++) state.workers.push(createWorker(i));
}

function assignWorker(w) {
  // Find closest available resource node with stock
  const available = state.resourceNodes.filter(n => !n.depleted && n.stock > 0);
  if (!available.length) { w.state = 'idle'; return; }

  // Prefer nodes not currently targeted by other workers
  const targeted = new Set(state.workers.filter(x => x !== w && x.targetNode !== null).map(x => x.targetNode?.id));
  const preferred = available.filter(n => !targeted.has(n.id));
  const pool = preferred.length ? preferred : available;

  // Pick by distance
  pool.sort((a, b) => {
    const da = Math.hypot(a.gx - w.gx, a.gy - w.gy);
    const db = Math.hypot(b.gx - w.gx, b.gy - w.gy);
    return da - db;
  });
  w.targetNode = pool[0];
  w.state = 'moving';
}

function updateWorker(w, dt) {
  // Always sync screen coords from grid coords (no bob — applied at draw time only)
  const syncPos = () => { const p = isoProject(w.gx, w.gy); w.x = p.x; w.y = p.y; };

  if (w.state === 'idle') {
    syncPos();
    assignWorker(w);
    return;
  }

  if (w.state === 'moving') {
    if (!w.targetNode || w.targetNode.depleted) { w.state = 'idle'; w.targetNode = null; return; }
    const tx = w.targetNode.gx, ty = w.targetNode.gy;
    const dx = tx - w.gx, dy = ty - w.gy;
    const dist = Math.hypot(dx, dy);
    if (dist < 0.18) {
      w.gx = tx; w.gy = ty;
      w.state = 'gathering';
      w.gatherTimer = 0;
    } else {
      const spd = w.speed * (dt / 1000) * 2.2;
      w.gx += (dx / dist) * spd;
      w.gy += (dy / dist) * spd;
    }
    syncPos();
    return;
  }

  if (w.state === 'gathering') {
    syncPos();
    w.gatherTimer += dt;
    if (w.gatherTimer > 1800) {
      const node = w.targetNode;
      if (!node || node.depleted || node.stock <= 0) { w.state = 'idle'; w.targetNode = null; return; }
      const take = Math.min(node.amt, node.stock);
      node.stock -= take;
      if (node.stock <= 0) { node.depleted = true; node.stock = 0; }
      w.carrying = node.yield;
      w.carryAmt = take;
      spawnFloat('+' + take + (node.yield === 'wood' ? '🪵' : node.yield === 'food' ? '🥩' : '🪙'), w.x, w.y - 20);
      w.targetNode = null;
      w.state = 'returning';
    }
    return;
  }

  if (w.state === 'returning') {
    // Return to a spot slightly scattered around base so workers don't stack
    const tx = BASE_CX + w.homeOffset.x, ty = BASE_CY + w.homeOffset.y;
    const dx = tx - w.gx, dy = ty - w.gy;
    const dist = Math.hypot(dx, dy);
    if (dist < 0.18) {
      state[w.carrying] += w.carryAmt;
      w.carrying = null; w.carryAmt = 0;
      w.gx = tx; w.gy = ty;
      w.state = 'idle';
      updateHUD();
    } else {
      const spd = w.speed * (dt / 1000) * 2.2;
      w.gx += (dx / dist) * spd;
      w.gy += (dy / dist) * spd;
    }
    syncPos();
  }
}

// ─── Snow particles ──────────────────────────────────────────────────────────────────────────────
function initSnow() {
  for (let i = 0; i < 80; i++) spawnSnow();
}
function spawnSnow() {
  state.snowParticles.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: 1 + Math.random() * 2.5,
    vx: (Math.random() - 0.5) * 0.4,
    vy: 0.3 + Math.random() * 0.7,
    alpha: 0.3 + Math.random() * 0.7,
  });
}

function updateSnow(dt) {
  const intensity = state.storm ? 3 : 1;
  while (state.snowParticles.length < 80 * intensity) spawnSnow();
  state.snowParticles.forEach(p => {
    p.x += p.vx * intensity + (state.storm ? Math.sin(state.tick * 0.03) * 1.5 : 0);
    p.y += p.vy * intensity;
    if (p.y > canvas.height + 5) { p.y = -5; p.x = Math.random() * canvas.width; }
  });
}

// ─── Floating texts ──────────────────────────────────────────────────────────────────────────────
function spawnFloat(text, x, y) {
  state.floatingTexts.push({ text, x, y, life: 90, alpha: 1 });
}

// ─── Day/night cycle ──────────────────────────────────────────────────────────────────────────────
function updateDay(dt) {
  state.dayTimer += dt;
  if (state.dayTimer > state.DAY_DURATION * 60) {
    state.dayTimer = 0;
    state.day++;
    document.getElementById('day-num').textContent = state.day;
    // Every 5 days, trigger storm
    if (state.day % 5 === 0) triggerStorm();
    else showToast(`Day ${state.day} begins ❄️`);
    // Regen depleted nodes
    state.resourceNodes.forEach(n => {
      if (n.depleted) { n.depleted = false; n.stock = Math.floor(n.max * 0.6); }
    });
  }
}

function triggerStorm() {
  state.storm = true;
  state.stormTimer = 0;
  const el = document.getElementById('storm-warning');
  el.style.display = 'block';
  showToast('❄️ Blizzard! Workers shelter now!');
  setTimeout(() => { el.style.display = 'none'; }, 3000);
  // Workers retreat to base during storm
  state.workers.forEach(w => {
    w.state = 'returning'; w.targetNode = null; w.carrying = null;
  });
}

function updateStorm(dt) {
  if (!state.storm) return;
  state.stormTimer += dt;
  // Storm lasts ~15 seconds real time
  if (state.stormTimer > 900) {
    state.storm = false;
    // Storm damage: lose some food based on wall/fire level
    const dmg = Math.max(0, 10 - state.wallLevel * 2 - state.fireLevel * 2);
    if (dmg > 0) {
      state.food = Math.max(0, state.food - dmg);
      showToast(`Storm ended. Lost ${dmg} food 🥩`);
    } else {
      showToast('Storm survived! Your base held! 💪');
    }
    state.survivalScore++;
    updateHUD();
  }
}

// ─── Regen resource nodes ─────────────────────────────────────────────────────────────────────────────
function updateNodes(dt) {
  state.resourceNodes.forEach(n => {
    if (n.stock < n.max) {
      n.regenTimer += dt * n.rate;
      if (n.regenTimer >= 1) {
        n.stock = Math.min(n.max, n.stock + Math.floor(n.regenTimer));
        n.regenTimer %= 1;
        n.depleted = false;
      }
    }
  });
}

// ─── Drawing ───────────────────────────────────────────────────────────────────────────────────────
function drawBackground() {
  // Sky gradient
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  const stormFactor = state.storm ? 0.6 : 1;
  grad.addColorStop(0, `rgb(${Math.floor(15 * stormFactor)},${Math.floor(25 * stormFactor)},${Math.floor(55 * stormFactor)})`);
  grad.addColorStop(1, `rgb(${Math.floor(30 * stormFactor)},${Math.floor(50 * stormFactor)},${Math.floor(90 * stormFactor)})`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function drawGrid() {
  // Sort tiles back-to-front for correct iso rendering
  const tiles = [];
  for (let gy = 0; gy < GRID_ROWS; gy++) {
    for (let gx = 0; gx < GRID_COLS; gx++) {
      tiles.push({ gx, gy });
    }
  }
  tiles.sort((a, b) => (a.gx + a.gy) - (b.gx + b.gy));

  tiles.forEach(({ gx, gy }) => {
    const p = isoProject(gx, gy);
    const isBase = Math.abs(gx - BASE_CX) <= 3 && Math.abs(gy - BASE_CY) <= 3;
    const isCenter = Math.abs(gx - BASE_CX) <= 1 && Math.abs(gy - BASE_CY) <= 1;
    drawIsoTile(p.x, p.y, isBase, isCenter);
  });
}

function drawIsoTile(x, y, isBase, isCenter) {
  const hw = TW / 2, hh = TH / 2;
  ctx.beginPath();
  ctx.moveTo(x, y - hh);
  ctx.lineTo(x + hw, y);
  ctx.lineTo(x, y + hh);
  ctx.lineTo(x - hw, y);
  ctx.closePath();

  if (isCenter) {
    ctx.fillStyle = '#5a6a80';
  } else if (isBase) {
    ctx.fillStyle = '#d4a870'; // sandy/dirt ground inside base
  } else {
    ctx.fillStyle = '#c8dff0'; // snow
  }
  ctx.fill();
  ctx.strokeStyle = isBase ? 'rgba(180,140,80,0.3)' : 'rgba(180,210,240,0.4)';
  ctx.lineWidth = 0.5;
  ctx.stroke();
}

function drawWall() {
  // Draw fence/wall around base
  const wallColor = ['', '#8b5e3c', '#7a4a2a', '#5a3a1a'][Math.min(state.wallLevel, 3)];
  const r = 3; // radius of base in grid units
  const wallPosts = [
    [BASE_CX - r, BASE_CY - r], [BASE_CX, BASE_CY - r], [BASE_CX + r, BASE_CY - r],
    [BASE_CX + r, BASE_CY], [BASE_CX + r, BASE_CY + r],
    [BASE_CX, BASE_CY + r], [BASE_CX - r, BASE_CY + r], [BASE_CX - r, BASE_CY],
  ];

  // Draw wall segments
  for (let i = 0; i < wallPosts.length; i++) {
    const [ax, ay] = wallPosts[i];
    const [bx, by] = wallPosts[(i + 1) % wallPosts.length];
    const pa = isoProject(ax, ay);
    const pb = isoProject(bx, by);

    ctx.beginPath();
    ctx.moveTo(pa.x, pa.y);
    ctx.lineTo(pb.x, pb.y);
    ctx.strokeStyle = wallColor;
    ctx.lineWidth = 3 + state.wallLevel;
    ctx.stroke();

    // Wall post
    ctx.beginPath();
    ctx.arc(pa.x, pa.y - 8, 4, 0, Math.PI * 2);
    ctx.fillStyle = wallColor;
    ctx.fill();
  }

  // Draw gate at south-west
  const gate = isoProject(BASE_CX - r, BASE_CY);
  ctx.fillStyle = '#5a3010';
  ctx.fillRect(gate.x - 10, gate.y - 20, 20, 25);
  ctx.fillStyle = '#8b5020';
  ctx.fillRect(gate.x - 8, gate.y - 18, 8, 22);
  ctx.fillRect(gate.x + 1, gate.y - 18, 8, 22);
}

function drawBuildings() {
  // Main building (command post)
  const cp = isoProject(BASE_CX, BASE_CY - 1);
  drawIsoBuilding(cp.x, cp.y, 30, 45, '#6b4c2a', '#8b6c3a', '#5a3c1a');
  // Chimney
  ctx.fillStyle = '#4a3020';
  ctx.fillRect(cp.x + 5, cp.y - 58, 8, 18);
  // Fire/smoke
  if (state.fireLevel >= 1) {
    drawFire(cp.x + 9, cp.y - 60);
  }

  // Storage shed
  const st = isoProject(BASE_CX + 1, BASE_CY + 1);
  drawIsoBuilding(st.x, st.y, 20, 30, '#7a5030', '#9a7040', '#6a4020');

  // Watchtower
  const wt = isoProject(BASE_CX - 1, BASE_CY + 1);
  ctx.fillStyle = '#5a3c1a';
  ctx.fillRect(wt.x - 6, wt.y - 60, 12, 65);
  ctx.fillStyle = '#6b4c2a';
  ctx.fillRect(wt.x - 10, wt.y - 65, 20, 12);

  // Campfire in center
  drawFire(isoProject(BASE_CX, BASE_CY).x, isoProject(BASE_CX, BASE_CY).y - 6);
}

function drawIsoBuilding(x, y, w, h, sideColor, topColor, shadowColor) {
  const hw = w, hh = w * 0.5;
  // Shadow
  ctx.beginPath();
  ctx.moveTo(x, y + hh * 0.4);
  ctx.lineTo(x + hw, y + hh * 0.9);
  ctx.lineTo(x, y + hh * 1.4);
  ctx.lineTo(x - hw, y + hh * 0.9);
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.fill();

  // Left face
  ctx.beginPath();
  ctx.moveTo(x - hw, y - h);
  ctx.lineTo(x, y - h + hh);
  ctx.lineTo(x, y + hh);
  ctx.lineTo(x - hw, y);
  ctx.fillStyle = shadowColor;
  ctx.fill();

  // Right face
  ctx.beginPath();
  ctx.moveTo(x + hw, y - h);
  ctx.lineTo(x, y - h + hh);
  ctx.lineTo(x, y + hh);
  ctx.lineTo(x + hw, y);
  ctx.fillStyle = sideColor;
  ctx.fill();

  // Top face
  ctx.beginPath();
  ctx.moveTo(x, y - h - hh);
  ctx.lineTo(x + hw, y - h);
  ctx.lineTo(x, y - h + hh);
  ctx.lineTo(x - hw, y - h);
  ctx.fillStyle = topColor;
  ctx.fill();

  // Snow on top
  ctx.beginPath();
  ctx.moveTo(x, y - h - hh + 4);
  ctx.lineTo(x + hw * 0.8, y - h + 4);
  ctx.lineTo(x, y - h + hh - 2);
  ctx.lineTo(x - hw * 0.8, y - h + 4);
  ctx.fillStyle = 'rgba(220,240,255,0.7)';
  ctx.fill();

  // Door
  ctx.fillStyle = '#3a2010';
  ctx.fillRect(x - 5, y + hh * 0.1 - 16, 10, 15);
}

function drawFire(x, y) {
  const t = state.tick;
  for (let i = 0; i < 6; i++) {
    const flicker = Math.sin(t * 0.15 + i * 1.1) * 3;
    const h = 8 + i * 2 + flicker;
    ctx.beginPath();
    ctx.arc(x + Math.sin(i * 2.1) * 3, y - h, 2 + i * 0.5, 0, Math.PI * 2);
    ctx.fillStyle = i < 2 ? '#ff4400' : i < 4 ? '#ff8800' : '#ffcc00';
    ctx.globalAlpha = 0.8 - i * 0.1;
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  // Glow
  const grd = ctx.createRadialGradient(x, y, 0, x, y, 18);
  grd.addColorStop(0, 'rgba(255,120,0,0.25)');
  grd.addColorStop(1, 'rgba(255,120,0,0)');
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.arc(x, y, 18, 0, Math.PI * 2); ctx.fill();
}

function drawResourceNodes() {
  // Sort by depth
  const sorted = [...state.resourceNodes].sort((a, b) => (a.gx + a.gy) - (b.gx + b.gy));
  sorted.forEach(node => {
    if (node.depleted) return;
    const p = isoProject(node.gx, node.gy);
    const stockRatio = node.stock / node.max;

    // Shadow
    ctx.beginPath();
    ctx.ellipse(p.x, p.y + 4, 14, 7, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,30,0.3)';
    ctx.fill();

    // Node graphic
    if (node.type === 'tree') {
      drawTree(p.x, p.y, stockRatio);
    } else if (node.type === 'animal') {
      drawAnimal(p.x, p.y, stockRatio);
    } else {
      drawMine(p.x, p.y, stockRatio);
    }

    // Stock bar
    const barW = 28;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(p.x - barW / 2, p.y - 36, barW, 4);
    ctx.fillStyle = stockRatio > 0.5 ? '#44ff88' : stockRatio > 0.25 ? '#ffcc00' : '#ff4444';
    ctx.fillRect(p.x - barW / 2, p.y - 36, barW * stockRatio, 4);
  });
}

function drawTree(x, y, ratio) {
  const t = state.tick;
  const sway = Math.sin(t * 0.025) * 1.5;
  // Trunk
  ctx.fillStyle = '#5a3a1a';
  ctx.fillRect(x - 3 + sway * 0.3, y - 20, 6, 22);
  // Layers
  [[0, 28], [6, 22], [10, 16]].forEach(([off, w], i) => {
    ctx.beginPath();
    ctx.moveTo(x + sway * (i * 0.4), y - 18 - off);
    ctx.lineTo(x + w / 2 + sway * (i * 0.4), y - off);
    ctx.lineTo(x - w / 2 + sway * (i * 0.4), y - off);
    ctx.closePath();
    ctx.fillStyle = ratio > 0.3 ? `hsl(${130 + i * 10},${50 + i * 10}%,${28 + i * 4}%)` : '#5a6a5a';
    ctx.fill();
  });
  // Snow on tree
  ctx.beginPath();
  ctx.moveTo(x + sway, y - 44);
  ctx.lineTo(x + 8 + sway * 0.5, y - 28);
  ctx.lineTo(x - 8 + sway * 0.5, y - 28);
  ctx.closePath();
  ctx.fillStyle = 'rgba(220,240,255,0.8)';
  ctx.fill();
}

function drawAnimal(x, y, ratio) {
  // Simple bear shape
  const c = ratio > 0.3 ? '#8b6040' : '#6a5040';
  ctx.fillStyle = c;
  // Body
  ctx.beginPath(); ctx.ellipse(x, y - 8, 12, 8, 0, 0, Math.PI * 2); ctx.fill();
  // Head
  ctx.beginPath(); ctx.ellipse(x + 10, y - 14, 8, 7, 0.3, 0, Math.PI * 2); ctx.fill();
  // Ears
  ctx.beginPath(); ctx.arc(x + 14, y - 20, 3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 8, y - 21, 3, 0, Math.PI * 2); ctx.fill();
  // Eye
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(x + 14, y - 15, 2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(x + 14.5, y - 15, 1, 0, Math.PI * 2); ctx.fill();
  // Snow patch
  ctx.fillStyle = 'rgba(220,240,255,0.5)';
  ctx.beginPath(); ctx.ellipse(x - 2, y - 8, 6, 3, -0.3, 0, Math.PI * 2); ctx.fill();
}

function drawMine(x, y, ratio) {
  // Rock/mine shaft
  ctx.fillStyle = ratio > 0.3 ? '#8a7a60' : '#6a6a60';
  ctx.beginPath();
  ctx.moveTo(x, y - 28);
  ctx.lineTo(x + 16, y - 10);
  ctx.lineTo(x + 12, y);
  ctx.lineTo(x - 12, y);
  ctx.lineTo(x - 16, y - 10);
  ctx.closePath();
  ctx.fill();
  // Shaft entrance
  ctx.fillStyle = '#2a2020';
  ctx.beginPath();
  ctx.ellipse(x, y - 4, 8, 5, 0, 0, Math.PI * 2);
  ctx.fill();
  // Pickaxe icon
  ctx.fillStyle = '#ccaa44';
  ctx.font = '14px serif'; ctx.textAlign = 'center';
  ctx.fillText('⛏️', x, y - 12);
  // Sparkle
  if (Math.sin(state.tick * 0.1 + x) > 0.8) {
    ctx.fillStyle = '#ffdd44';
    ctx.font = '10px serif';
    ctx.fillText('✨', x + 8, y - 22);
  }
}

function drawWorkers() {
  const sorted = [...state.workers].sort((a, b) => a.y - b.y);
  sorted.forEach(w => {
    const t = state.tick;
    const bob = Math.sin(t * 0.12 + w.bobOffset) * (w.state === 'idle' ? 0 : 2);

    // Shadow
    ctx.beginPath();
    ctx.ellipse(w.x, w.y + 6, 8, 4, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,40,0.35)';
    ctx.fill();

    // Body
    ctx.fillStyle = w.color;
    ctx.beginPath();
    ctx.arc(w.x, w.y - 14 + bob, 5, 0, Math.PI * 2); // head
    ctx.fill();
    // Hat
    ctx.fillStyle = '#2040a0';
    ctx.fillRect(w.x - 6, w.y - 22 + bob, 12, 4);
    ctx.fillRect(w.x - 4, w.y - 28 + bob, 8, 8);
    // Body coat
    ctx.fillStyle = '#3050b0';
    ctx.fillRect(w.x - 5, w.y - 9 + bob, 10, 14);
    // Arms (walking animation)
    const armSwing = (w.state === 'moving' || w.state === 'returning') ? Math.sin(t * 0.18 + w.bobOffset) * 6 : 0;
    ctx.fillStyle = '#2040a0';
    ctx.fillRect(w.x - 9, w.y - 8 + armSwing + bob, 4, 9);
    ctx.fillRect(w.x + 5, w.y - 8 - armSwing + bob, 4, 9);
    // Carry item
    if (w.carrying) {
      ctx.font = '14px serif'; ctx.textAlign = 'center';
      ctx.fillText(w.carrying === 'wood' ? '🪵' : w.carrying === 'food' ? '🥩' : '🪙', w.x, w.y - 32 + bob);
    }

    // State indicator dot
    const dotColors = { idle: '#aaaaaa', moving: '#44ff88', gathering: '#ffcc00', returning: '#ff8844' };
    ctx.fillStyle = dotColors[w.state] || '#fff';
    ctx.beginPath(); ctx.arc(w.x + 6, w.y - 22 + bob, 3, 0, Math.PI * 2); ctx.fill();
  });
}

function drawSnow() {
  state.snowParticles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(220,240,255,${p.alpha * (state.storm ? 0.9 : 0.7)})`;
    ctx.fill();
  });
}

function drawFloatingTexts() {
  state.floatingTexts = state.floatingTexts.filter(ft => ft.life > 0);
  state.floatingTexts.forEach(ft => {
    ctx.globalAlpha = ft.alpha;
    ctx.font = 'bold 14px -apple-system';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 3;
    ctx.strokeText(ft.text, ft.x, ft.y);
    ctx.fillText(ft.text, ft.x, ft.y);
    ft.y -= 0.5;
    ft.life--;
    ft.alpha = ft.life / 90;
  });
  ctx.globalAlpha = 1;
}

function drawStormOverlay() {
  if (!state.storm) return;
  const intensity = Math.min(state.stormTimer / 120, 0.5);
  ctx.fillStyle = `rgba(200,220,255,${intensity * 0.15})`;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  // Vignette
  const vgrd = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, canvas.height * 0.3, canvas.width / 2, canvas.height / 2, canvas.height);
  vgrd.addColorStop(0, 'transparent');
  vgrd.addColorStop(1, `rgba(100,150,255,${intensity * 0.4})`);
  ctx.fillStyle = vgrd;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

// ─── Main loop ──────────────────────────────────────────────────────────────────────────────────────
let lastTime = 0;
function loop(ts) {
  const dt = Math.min(ts - lastTime, 50);
  lastTime = ts;
  state.tick++;

  updateDay(dt);
  updateStorm(dt);
  updateSnow(dt);
  updateNodes(dt);
  if (!state.storm) {
    state.workers.forEach(w => updateWorker(w, dt));
  }

  // Draw everything in iso order
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawBackground();
  drawGrid();
  drawWall();

  // Collect all drawables and sort by iso depth
  const drawCalls = [];
  state.resourceNodes.filter(n => !n.depleted).forEach(n => {
    const p = isoProject(n.gx, n.gy);
    drawCalls.push({ depth: n.gx + n.gy, fn: () => { /* already handles self */ } });
  });

  // Draw buildings
  drawBuildings();
  drawResourceNodes();
  drawWorkers();
  drawSnow();
  drawFloatingTexts();
  drawStormOverlay();

  updateHUDButtons();
  requestAnimationFrame(loop);
}

// ─── HUD ──────────────────────────────────────────────────────────────────────────────────────────────
function updateHUD() {
  document.getElementById('r-gold').textContent = state.gold;
  document.getElementById('r-food').textContent = state.food;
  document.getElementById('r-wood').textContent = state.wood;
  document.getElementById('r-workers').textContent = state.workers.length;
}

function updateHUDButtons() {
  const wc = state.workerCost;
  document.getElementById('worker-cost').textContent = '🪙' + wc;
  document.getElementById('btn-worker').className = 'btn' + (state.gold < wc ? ' disabled' : '');
  document.getElementById('wall-cost').textContent = '🪵' + state.wallCost;
  document.getElementById('btn-wall').className = 'btn' + (state.wood < state.wallCost ? ' disabled' : '');
  document.getElementById('fire-cost').textContent = '🪵' + state.fireCost;
  document.getElementById('btn-fire').className = 'btn' + (state.wood < state.fireCost ? ' disabled' : '');
  document.getElementById('feast-cost').textContent = '🥩' + state.feastCost;
  document.getElementById('btn-feast').className = 'btn' + (state.food < state.feastCost ? ' disabled' : '');
}

// ─── Button actions ─────────────────────────────────────────────────────────────────────────────────────
function buyWorker() {
  if (state.gold < state.workerCost) return showToast('Need more gold 🪙');
  state.gold -= state.workerCost;
  state.workerCost = Math.floor(state.workerCost * 1.5);
  const w = createWorker(state.workers.length);
  w.gx = BASE_CX + (Math.random() - 0.5) * 2;
  w.gy = BASE_CY + (Math.random() - 0.5) * 2;
  const p = isoProject(w.gx, w.gy);
  w.x = p.x; w.y = p.y;
  state.workers.push(w);
  showToast('New worker hired! 👷');
  updateHUD();
}

function upgradeWall() {
  if (state.wood < state.wallCost) return showToast('Need more wood 🪵');
  state.wood -= state.wallCost;
  state.wallLevel = Math.min(3, state.wallLevel + 1);
  state.wallCost = Math.floor(state.wallCost * 1.8);
  showToast(`Wall upgraded to level ${state.wallLevel}! 🧱`);
  updateHUD();
}

function upgradeFire() {
  if (state.wood < state.fireCost) return showToast('Need more wood 🪵');
  state.wood -= state.fireCost;
  state.fireLevel = Math.min(5, state.fireLevel + 1);
  state.fireCost = Math.floor(state.fireCost * 1.6);
  showToast(`Hearth upgraded! Level ${state.fireLevel} 🔥`);
  updateHUD();
}

function feast() {
  if (state.food < state.feastCost) return showToast('Need more food 🥩');
  state.food -= state.feastCost;
  // Speed boost for workers
  state.workers.forEach(w => { w.speed += 0.3; });
  spawnFloat('⚡ Workers energized!', canvas.width / 2, canvas.height / 2);
  showToast('Feast! Workers move faster ⚡');
  updateHUD();
}

// ─── Toast ───────────────────────────────────────────────────────────────────────────────────────────────
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

// ─── Touch/tap on canvas ────────────────────────────────────────────────────────────────────────────
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const touch = e.touches[0];
  const tx = touch.clientX, ty = touch.clientY;
  // Check if tapping near a resource node
  state.resourceNodes.forEach(n => {
    if (n.depleted) return;
    const p = isoProject(n.gx, n.gy);
    if (Math.hypot(tx - p.x, ty - p.y) < 30) {
      // Send nearest idle worker
      const idle = state.workers.find(w => w.state === 'idle');
      if (idle) {
        idle.targetNode = n;
        idle.state = 'moving';
        showToast('Worker dispatched! 👷');
      }
    }
  });
}, { passive: false });

// ─── Camera pan ─────────────────────────────────────────────────────────────────────────────────────
let lastTouch = null;
canvas.addEventListener('touchmove', e => {
  if (e.touches.length === 2) {
    e.preventDefault();
    const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    if (lastTouch) {
      state.cameraX += cx - lastTouch.x;
      state.cameraY += cy - lastTouch.y;
      // Clamp camera
      state.cameraX = Math.max(-200, Math.min(200, state.cameraX));
      state.cameraY = Math.max(-150, Math.min(150, state.cameraY));
    }
    lastTouch = { x: cx, y: cy };
  }
}, { passive: false });

canvas.addEventListener('touchend', () => { lastTouch = null; });

// ─── Save / Load ────────────────────────────────────────────────────────────────────────────────────────
const SAVE_KEY = 'frostSurvival_v1';

function saveGame() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      gold: state.gold, food: state.food, wood: state.wood,
      workerCount: state.workers.length, workerCost: state.workerCost,
      wallLevel: state.wallLevel, wallCost: state.wallCost,
      fireLevel: state.fireLevel, fireCost: state.fireCost,
      day: state.day, survivalScore: state.survivalScore,
    }));
  } catch(e) {}
}

function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const s = JSON.parse(raw);
    state.gold = s.gold ?? 10;
    state.food = s.food ?? 10;
    state.wood = s.wood ?? 5;
    state.workerCost = s.workerCost ?? 20;
    state.wallLevel = s.wallLevel ?? 1;
    state.wallCost = s.wallCost ?? 30;
    state.fireLevel = s.fireLevel ?? 1;
    state.fireCost = s.fireCost ?? 20;
    state.day = s.day ?? 1;
    state.survivalScore = s.survivalScore ?? 0;
    document.getElementById('day-num').textContent = state.day;
    const extra = Math.max(0, (s.workerCount ?? 3) - 3);
    for (let i = 0; i < extra; i++) state.workers.push(createWorker(3 + i));
    return true;
  } catch(e) { return false; }
}

// Auto-save every 15 seconds and on tab hide
setInterval(saveGame, 15000);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); });
window.addEventListener('pagehide', saveGame);

// ─── Init ──────────────────────────────────────────────────────────────────────────────────────────────────
initResourceNodes();
initWorkers();
initSnow();
const resumed = loadGame();
updateHUD();
showToast(resumed ? `Welcome back! Day ${state.day} ❄️` : 'Survive the frost! ❄️ Tap nodes to send workers');
requestAnimationFrame(loop);
</script>
