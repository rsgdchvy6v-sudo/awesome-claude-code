name: Enable GitHub Pages

on:
  workflow_dispatch:

permissions:
  pages: write
  contents: read
  administration: write

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Enable GitHub Pages
        run: |
          echo "Enabling GitHub Pages from gh-pages branch..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"source":{"branch":"gh-pages","path":"/"}}')
          echo "POST response: $RESPONSE"
          if [ "$RESPONSE" = "409" ]; then
            echo "Pages already exists, updating source..."
            curl -s -X PUT \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/${{ github.repository }}/pages \
              -d '{"source":{"branch":"gh-pages","path":"/"}}'
          fi
          echo "Done! Game will be live at: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
